name: Build Waterfox Official Stock (Pure Linux Default)

on:
  push:
    branches: [ "current", "master", "main" ]
  workflow_dispatch: 

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      MOZ_AUTOMATION: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            libgtk-3-dev \
            libpulse-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            xvfb \
            yasm \
            unzip \
            uuid-dev \
            libasound2-dev \
            libiw-dev \
            mesa-common-dev \
            cbindgen \
            clang \
            lld

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Mozilla Bootstrap (Automation Fixed)
        run: |
          # 1. We move --no-interactive BEFORE the bootstrap instruction.
          # 2. We pipe "yes" into the command line to auto-answer fallback prompts.
          yes | python3 ./mach --no-interactive bootstrap --application-choice="browser"

      - name: Compile Waterfox Stock
        run: |
          # Uses Waterfox's built-in platform config out of the box
          ./mach build

      - name: Package Application
        run: |
          ./mach package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-stock-linux-build
          path: obj-*/dist/*.tar.bz2

name: Build Waterfox Official Stock

on:
  push:
    branches: [ "current", "master", "main" ]
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công trong tab Actions

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    env:
      MOZ_AUTOMATION: "1"
      MACH_USE_SYSTEM_PYTHON: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3-dev \
            python3-pip \
            python3-venv \
            libgtk-3-dev \
            libpulse-dev \
            libdbus-glib-1-dev \
            libxt-dev \
            xvfb \
            yasm \
            unzip \
            uuid-dev \
            libasound2-dev \
            libiw-dev \
            mesa-common-dev \
            cbindgen \
            clang \
            lld

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run Mozilla Bootstrap (Fixed Isolation Mode)
        run: |
          # Xóa các cờ ràng buộc của hệ thống GitHub để tránh lỗi venv assertion
          export PIP_REQUIRE_VIRTUALENV=""
          
          # Khởi tạo một môi trường Python ảo cô lập hoàn toàn cho mach hoạt động
          python3 -m venv target_env
          source target_env/bin/activate
          
          # Chạy chính xác câu lệnh bootstrap của bạn bằng luồng tự động trả lời yes
          yes | ./mach bootstrap --application-choice=browser

      - name: Compile Waterfox Stock
        run: |
          # Không đụng vào cấu hình .mozconfig tự tạo
          # Hệ thống tự động nhận diện file cấu hình gốc đi kèm của Waterfox
          ./mach build

      - name: Package Application
        run: |
          ./mach package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-stock-linux-build
          path: obj-*/dist/*.tar.bz2

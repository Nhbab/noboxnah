name: Build Waterfox Official Stock (Pure Windows Native)

on:
  push:
    branches: [ "current", "master", "main" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-2022
    
    env:
      # Native automation environments that govern Gecko-based code compilation
      MOZ_AUTOMATION: "1"
      MACH_USE_SYSTEM_PYTHON: "1"
      
      # Bypasses Taskcluster tracking validations natively without rewriting file parameters
      TASK_ID: "0"
      MOZ_DISABLE_TASKGRAPH: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Waterfox Stock (Direct Host Call)
        shell: cmd
        run: |
          .\mach build

      - name: Package Application
        shell: cmd
        run: |
          python3 mach package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-stock-windows-build
          path: |
            obj-*/dist/*.zip
            obj-*/dist/*.exe

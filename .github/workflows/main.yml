name: Build Waterfox Official Stock (Pure Windows PowerShell)

on:
  push:
    branches: [ "current", "master", "main" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-2022
    
    env:
      MOZILLABUILD_DIR: "C:\\mozilla-build"
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: "system"
      TASK_ID: "0"
      MOZ_DISABLE_TASKGRAPH: "1"
      TASKCLUSTER_ROOT_URL: "https://mozilla.com"

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MozillaBuild and NASM via Chocolatey
        run: |
          # Quietly installs MozillaBuild tools and the missing NASM hardware assembler
          choco install mozillabuild nasm -y --no-progress

      - name: Inject System Paths Directly to Host
        run: |
          # Adds MozillaBuild tool vectors and NASM location straight to your active system path
          $mozPaths = @(
              "C:\mozilla-build",
              "C:\mozilla-build\msys2\usr\bin",
              "C:\mozilla-build\python3",
              "C:\mozilla-build\python3\Scripts",
              "C:\Program Files\NASM"
          )
          foreach ($path in $mozPaths) {
              if (Test-Path $path) {
                  Write-Output "Adding to PATH: $path"
                  echo "$path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
          }

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Compile Waterfox Stock (Direct PowerShell Call)
        run: |
          # Injects the bootstrap override block into runtime process memory
          $env:MOZ_CONFIGURE_OPTIONS = "--enable-bootstrap=no-update"
          $env:MOZ_BOOTSTRAP_LATEST = "1"
          
          .\mach build

      - name: Package Application
        run: |
          $env:MOZ_CONFIGURE_OPTIONS = "--enable-bootstrap=no-update"
          $env:MOZ_BOOTSTRAP_LATEST = "1"
          .\mach package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-stock-windows-build
          path: |
            obj-*/dist/*.zip
            obj-*/dist/*.exe

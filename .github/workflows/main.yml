name: Build Waterfox Official Stock (Pure Windows PowerShell)

on:
  push:
    branches: [ "current", "master", "main" ]
  workflow_dispatch: 

jobs:
  build-windows:
    runs-on: windows-2022
    
    env:
      MOZILLABUILD_DIR: "C:\\mozilla-build"
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: "system"
      # We decouple MOZ_AUTOMATION to prevent the taskgraph from forcing a Taskcluster decision check
      TASK_ID: "0"
      MOZ_DISABLE_TASKGRAPH: "1"

 
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install MozillaBuild via Chocolatey
        run: |
          choco install mozillabuild -y --no-progress

      - name: Inject MozillaBuild Paths Directly to Host
        run: |
          $mozPaths = @(
              "C:\mozilla-build",
              "C:\mozilla-build\msys2\usr\bin",
              "C:\mozilla-build\python3",
              "C:\mozilla-build\python3\Scripts"
          )
          foreach ($path in $mozPaths) {
              if (Test-Path $path) {
                  Write-Output "Adding to PATH: $path"
                  echo "$path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              }
          }

      - name: Setup Rust Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Compile Waterfox Stock (Direct PowerShell Call)
        run: |
          # Explicitly trick the build system into knowing it doesn't need to download clang
          $env:MOZ_CONFIGURE_OPTIONS = "--enable-bootstrap=no-update"
          $env:MOZ_BOOTSTRAP_LATEST = "1"
          
          # Force python/mach to assume a local developer environment so it compiles instead of looking for CI artifacts
          .\mach build

      - name: Package Application
        run: |
          $env:MOZ_CONFIGURE_OPTIONS = "--enable-bootstrap=no-update"
          $env:MOZ_BOOTSTRAP_LATEST = "1"
          .\mach package

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waterfox-stock-windows-build
          path: |
            obj-*/dist/*.zip
            obj-*/dist/*.exe
